  <!-- Branded Web Loader Styles -->
  <style>
    body {
      background-color: #ECEBDE;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ECEBDE;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 48px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.65);
      box-shadow: 0 12px 32px rgba(196, 172, 161, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(193, 186, 161, 0.5);
    }
    .logo-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #AF8F6F, #C1BAA1);
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(175, 143, 111, 0.4);
      margin-bottom: 22px;
      letter-spacing: 1px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(175, 143, 111, 0.2);
      border-top: 3px solid #AF8F6F;
      border-right: 3px solid #C1BAA1;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-name {
      color: #424242;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 6px 0;
      letter-spacing: 0.5px;
    }
    .loading-role {
      color: #8C7A6B;
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .pulse-dots {
      display: inline-block;
    }
    .pulse-dots::after {
      content: '...';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loader-card">
      <div class="logo-avatar">MA</div>
      <div class="spinner"></div>
      <p class="loading-name">Moaz Ayman</p>
      <p class="loading-role">Flutter Developer<span class="pulse-dots"></span></p>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide loading screen smoothly once Flutter app elements mount
    window.addEventListener('DOMContentLoaded', function() {
      var checkFlutterReady = setInterval(function() {
        var flutterView = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
        if (flutterView || window.flutterAppLoaded) {
          var loader = document.getElementById('loading-screen');
          if (loader) {
            loader.classList.add('fade-out');
            setTimeout(function() { loader.remove(); }, 400);
          }
          clearInterval(checkFlutterReady);
        }
      }, 100);

      // Fallback timeout in case Flutter takes longer or structure varies
      setTimeout(function() {
        var loader = document.getElementById('loading-screen');
        if (loader && loader.parentNode) {
          loader.classList.add('fade-out');
          setTimeout(function() { loader.remove(); }, 400);
        }
      }, 4000);
    });
  </script>
</body>
